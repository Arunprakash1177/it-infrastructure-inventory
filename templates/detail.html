{% extends "base.html" %}
{% block title %}{{ server.hostname }}{% endblock %}
{% block content %}
<h2>Server details</h2>

<dl class="details">
    <dt>ID</dt>
    <dd>{{ server.id }}</dd>
    <dt>Hostname</dt>
    <dd>{{ server.hostname }}</dd>
    <dt>IP address</dt>
    <dd>{{ server.ip_address }}</dd>
    <dt>Operating system</dt>
    <dd>{{ server.os }}</dd>
</dl>

<div class="actions">
    <a class="button" href="{{ url_for('edit_server', server_id=server.id) }}">Edit</a>

    <form method="post" action="{{ url_for('delete_server', server_id=server.id) }}"
          onsubmit="return confirm('Delete this server? This cannot be undone.');">
        <button type="submit" class="danger">Delete</button>
    </form>

    <a class="button secondary" href="{{ url_for('index') }}">Back to list</a>
</div>
{% endblock %}
