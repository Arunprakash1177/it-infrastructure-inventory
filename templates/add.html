{% extends "base.html" %}
{% block title %}Add server{% endblock %}
{% block content %}
<h2>Add a server</h2>

<form method="post" action="{{ url_for('add_server') }}">
    <label for="hostname">Hostname</label>
    <input type="text" id="hostname" name="hostname" value="{{ hostname }}" placeholder="web-01" required>

    <label for="ip_address">IP address</label>
    <input type="text" id="ip_address" name="ip_address" value="{{ ip_address }}" placeholder="192.168.1.10" required>

    <label for="os">Operating system</label>
    <input type="text" id="os" name="os" value="{{ os_name }}" placeholder="Ubuntu 24.04" required>

    <div class="actions">
        <button type="submit">Save server</button>
        <a class="button secondary" href="{{ url_for('index') }}">Cancel</a>
    </div>
</form>
{% endblock %}
